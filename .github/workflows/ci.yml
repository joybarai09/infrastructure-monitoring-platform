
name: Infrastructure Monitoring CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build FastAPI Image
        run: |
          docker build \
            -t ghcr.io/joybarai09/infrastructure-monitoring-api:latest \
            ./app

      - name: Build Notification Service Image
        run: |
          docker build \
            -t ghcr.io/joybarai09/infrastructure-notification-service:latest \
            ./notification-service

      - name: Push FastAPI Image
        if: github.event_name == 'push'
        run: docker push ghcr.io/joybarai09/infrastructure-monitoring-api:latest

      - name: Push Notification Service Image
        if: github.event_name == 'push'
        run: docker push ghcr.io/joybarai09/infrastructure-notification-service:latest

